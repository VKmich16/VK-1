name: Standalone dashboard integration
on:
  push:
    paths: ['integration/**', '.github/workflows/standalone-integration.yml']
  pull_request:
    paths: ['integration/**', '.github/workflows/standalone-integration.yml']
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: YCTS-otree/VK-1
          ref: 696e8915e37ed3c12d35feff9bcd7702d1be6247
          path: community-reference
      - run: node integration/build.mjs ci
      - run: python3 integration/backend-test.py
      - run: npm --prefix community-reference/dsh-plugin run check
      - run: npm install --no-save --package-lock=false puppeteer
      - run: node integration/browser-test.cjs ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-check-results
          path: |
            integration/*-test-report.json
            integration/*-test.png
