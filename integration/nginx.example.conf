# Include inside your existing authenticated HTTPS dashboard server.
# Apply the same access controls to both locations; not a complete public vhost.
location /vk-1/api/ {
    proxy_pass http://127.0.0.1:18911;
    proxy_set_header Host $host;
    proxy_set_header X-VK1-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
}
location /vk-1/ {
    alias /opt/vk1-dash/current/;
}
