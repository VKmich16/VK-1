<!doctype html>
<meta charset="utf-8">
<title>左侧补全素材预览</title>
<style>
body{margin:24px;background:#e5e7eb;color:#182133;font:16px system-ui}
main{display:grid;grid-template-columns:1fr 1fr;gap:20px}
figure{margin:0;border-radius:10px;overflow:hidden;border:1px solid #aeb4bf}
figcaption{padding:12px;background:#eef0f4;color:#182133}
img{display:block;width:100%;height:auto}
.light{background:white}.dark{background:#222b3c}
</style>
<h1>左侧头发与鲸尾补全</h1>
<p>同一张透明 PNG 在浅色与深色底色上的显示。下沿保留原来的半身裁切。</p>
<main>
<figure class="light"><figcaption>浅色背景</figcaption><img src="sprite-left-completed.png" alt="浅色背景预览"></figure>
<figure class="dark"><figcaption>深色背景</figcaption><img src="sprite-left-completed.png" alt="深色背景预览"></figure>
</main>
